<!DOCTYPE html>
<html>
<head>
  <title>Esercizio Cifrario</title>
</head>
<body>

  <!-- PRIMA PAGINA -->
  <div id="pagina1">
    <h1>Cripta la frase</h1>
    
    <label>Frase:</label>
    <input type="text" id="frase"><br><br>
    
    <label>Scostamento:</label>
    <input type="number" id="scostamento1"><br><br>
    
    <button onclick="cripta()">Cripta</button>
    
    <p id="risultato1"></p>
    
    <hr>
    <button onclick="mostraPagina2()">Vai alla pagina 2</button>
  </div>

  <!-- SECONDA PAGINA -->
  <div id="pagina2" style="display: none;">
    <h1>Decripta la frase</h1>
    
    <label>Frase criptata:</label>
    <input type="text" id="fraseCriptata"><br><br>
    
    <label>Scostamento:</label>
    <input type="number" id="scostamento2"><br><br>
    
    <button onclick="decripta()">Decripta</button>
    
    <p id="risultato2"></p>
    
    <hr>
    <button onclick="mostraPagina1()">Torna alla pagina 1</button>
  </div>

  <script>
    var alfabeto = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

    function mostraPagina2() {
      document.getElementById("pagina1").style.display = "none";
      document.getElementById("pagina2").style.display = "block";
    }

    function mostraPagina1() {
      document.getElementById("pagina2").style.display = "none";
      document.getElementById("pagina1").style.display = "block";
    }

    function cripta() {
      var testo = document.getElementById("frase").value;
      var numero = parseInt(document.getElementById("scostamento1").value);
      var testoMaiuscolo = testo.toUpperCase();
      var risultato = "";

      for (var i = 0; i < testoMaiuscolo.length; i++) {
        var lettera = testoMaiuscolo[i];
        var posizione = alfabeto.indexOf(lettera);

        switch (posizione) {
          case -1:
            risultato = risultato + lettera;
            break;
          default:
            var nuovaPosizione = (posizione + numero) % 26;
            risultato = risultato + alfabeto[nuovaPosizione];
            break;
        }
      }

      document.getElementById("risultato1").innerHTML = "Frase criptata: " + risultato + " - Scostamento: " + numero;
      document.getElementById("fraseCriptata").value = risultato;
    }

    function decripta() {
      var testo = document.getElementById("fraseCriptata").value;
      var numero = parseInt(document.getElementById("scostamento2").value);
      var testoMaiuscolo = testo.toUpperCase();
      var risultato = "";

      for (var i = 0; i < testoMaiuscolo.length; i++) {
        var lettera = testoMaiuscolo[i];
        var posizione = alfabeto.indexOf(lettera);

        switch (posizione) {
          case -1:
            risultato = risultato + lettera;
            break;
          default:
            var nuovaPosizione = (posizione - numero) % 26;
            
            switch (nuovaPosizione < 0) {
              case true:
                nuovaPosizione = nuovaPosizione + 26;
                break;
            }
            
            risultato = risultato + alfabeto[nuovaPosizione];
            break;
        }
      }

      document.getElementById("risultato2").innerHTML = "Frase corretta: " + risultato;
    }
  </script>

</body>
</html>
